name: CI Failure — Auto-fix

# Fires when CI fails on a PR or on develop.
# Randy checks out the failing branch, reads the test output, fixes the
# code, runs the tests to confirm, then pushes the fix back to the same
# branch (or opens a PR if the failure is on develop/main directly).
#
# Loop guard: if the failing commit was already a Randy auto-fix attempt
# (message contains [auto-fix]) and it still failed, Randy posts a comment
# instead of retrying — human attention needed at that point.
#
# Required secrets:
#   ANTHROPIC_API_KEY — runs the Claude Code action

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  auto-fix:
    name: Auto-fix CI failure
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'

    permissions:
      contents: write        # push fix commits
      pull-requests: write   # post comments + open PRs for develop fixes
      actions: read          # download artifacts from the failed run
      id-token: write        # claude-code-action uses OIDC for GitHub App auth

    steps:
      - name: Resolve context
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID="${{ github.event.workflow_run.id }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"

          echo "run_id=$RUN_ID"           >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA"       >> "$GITHUB_OUTPUT"
          echo "head_branch=$HEAD_BRANCH" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/${{ github.repository }}/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

          PR_NUM=$(gh api \
            "repos/${{ github.repository }}/actions/runs/$RUN_ID" \
            --jq '.pull_requests[0].number // empty')
          echo "pr_number=${PR_NUM:-none}" >> "$GITHUB_OUTPUT"

          # Loop guard: check if the failing commit is already a Randy fix attempt
          COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/$HEAD_SHA" --jq '.commit.message')
          if echo "$COMMIT_MSG" | grep -q '\[auto-fix\]'; then
            echo "already_attempted=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_attempted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.head_branch }}
          fetch-depth: 0
          # Use a PAT or the default token — needs push permission
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "Randy[bot]"
          git config user.email "randy-bot@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Download test results so Randy can read the exact failures
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: android-test-results
          run-id: ${{ steps.ctx.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: test-results/
        continue-on-error: true

      # ── Case 1: Already tried once and still failing → human needed ──
      - name: Post "needs human" comment
        if: steps.ctx.outputs.already_attempted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="## 🔴 Auto-fix failed — human attention needed

          Randy attempted an automatic fix on a previous commit but CI is still red.

          **Failed run:** ${{ steps.ctx.outputs.run_url }}
          **Branch:** \`${{ steps.ctx.outputs.head_branch }}\`

          Please investigate manually. The test results artifact is attached to the failed run."

          if [ "${{ steps.ctx.outputs.pr_number }}" != "none" ]; then
            gh pr comment ${{ steps.ctx.outputs.pr_number }} --body "$BODY"
          else
            gh api "repos/${{ github.repository }}/commits/${{ steps.ctx.outputs.head_sha }}/comments" \
              -f body="$BODY"
          fi

      # ── Case 2: First failure → Randy fixes it ──
      - name: Randy — fix the CI failure
        if: steps.ctx.outputs.already_attempted == 'false'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            You are Randy, the developer agent for the ReWinds Compose Multiplatform project.
            CI just failed on branch `${{ steps.ctx.outputs.head_branch }}`.
            Your job: diagnose the failure, fix it, verify tests pass, and push the fix.

            ## Context
            - Branch     : ${{ steps.ctx.outputs.head_branch }}
            - Commit     : ${{ steps.ctx.outputs.head_sha }}
            - Failed run : ${{ steps.ctx.outputs.run_url }}
            - PR         : ${{ steps.ctx.outputs.pr_number }}

            ## Step-by-step

            1. **Read the failures.**
               Parse JUnit XML in test-results/ to find which tests failed and why:
               `find test-results/ -name "*.xml" | xargs grep -l 'failure\|error' 2>/dev/null`
               Read those files to get the class name, method, message, and stack trace.
               If no XML files exist, the build failed before tests ran — check for
               compilation errors in the source files on this branch.

            2. **Locate the broken code.**
               Use the failure message and stack trace to find the exact file and line.
               Read the relevant source files and test files to understand what changed.

            3. **Fix it.**
               Apply the minimal correct fix following all rules in CLAUDE.md and
               docs/agent/ARCHITECTURE-RULES.md. If a test is wrong (e.g. it was
               pinning a known bug that is now fixed), fix the test. If production
               code is broken, fix the production code.

            4. **Verify locally.**
               Run: `./gradlew :composeApp:testDebugUnitTest -PincludeAllTargets=false --no-daemon`
               If tests still fail, re-examine and fix again before committing.
               Do not commit a fix that does not pass locally.

            5. **Commit and push.**
               `git add <changed files>`
               `git commit -m "fix: <what you fixed> [auto-fix]"`
               `git push origin ${{ steps.ctx.outputs.head_branch }}`

               The [auto-fix] marker in the commit message is mandatory — it prevents
               this workflow from looping if CI fails again.

            6. **Post a comment** summarising what you found and fixed:
               - If PR is not "none":
                 `gh pr comment ${{ steps.ctx.outputs.pr_number }} --body "..."`
               - If PR is "none" (direct push to develop):
                 `gh api repos/${{ github.repository }}/commits/${{ steps.ctx.outputs.head_sha }}/comments -f body="..."`

               Comment format:
               ## 🔧 Auto-fix applied

               **Failure:** one-line description of what was broken
               **Fix:** one-line description of what was changed
               **Files changed:** list
               **Verification:** tests pass locally (`./gradlew testDebugUnitTest`)

               ---
               *Applied automatically by Randy. Review the commit before merging.*

            If you cannot determine a safe fix with confidence, post a comment
            explaining what you found and why you did not attempt a fix. Do not
            guess. Do not commit a fix that breaks other tests.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
