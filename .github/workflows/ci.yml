name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  android:
    name: Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build Android (Debug)
        run: ./gradlew :composeApp:assembleDebug -PincludeAllTargets=false --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest -PincludeAllTargets=false --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  ios:
    name: iOS Tests
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache CocoaPods specs
        uses: actions/cache@v4
        with:
          path: ~/.cocoapods
          key: cocoapods-${{ hashFiles('iosApp/Podfile.lock') }}
          restore-keys: |
            cocoapods-

      - name: Generate dummy Kotlin framework (required before pod install)
        run: ./gradlew :composeApp:generateDummyFramework --no-daemon

      - name: Install CocoaPods dependencies
        run: cd iosApp && pod install --repo-update

      - name: Install xcpretty
        run: gem install xcpretty --no-document

      - name: Select latest available iPhone simulator
        run: |
          SIMULATOR_UDID=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          devices = data.get('devices', {})
          iphones = []
          for runtime, devs in devices.items():
              if 'iOS' in runtime:
                  for d in devs:
                      if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                          iphones.append((runtime, d))
          iphones.sort(key=lambda x: x[0], reverse=True)
          if iphones:
              print(iphones[0][1]['udid'])
          else:
              raise SystemExit('No available iPhone simulator found')
          ")
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Selected simulator UDID: $SIMULATOR_UDID"
          xcrun simctl list devices | grep "$SIMULATOR_UDID"

      - name: Build and test iOS (simulator)
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild \
            -workspace iosApp/iosApp.xcworkspace \
            -scheme iosApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath TestResults.xcresult \
            -derivedDataPath build \
            test \
            2>&1 | tee xcodebuild.log | xcpretty --report junit --output TestResults/ios-test-results.xml
          BUILD_STATUS=${PIPESTATUS[0]}
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "=== BUILD/TEST FAILED (exit $BUILD_STATUS) ==="
            tail -200 xcodebuild.log
            exit $BUILD_STATUS
          fi

      - name: Upload test results (xcresult bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-xcresult
          path: TestResults.xcresult
          retention-days: 14

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results-junit
          path: TestResults/ios-test-results.xml
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: xcodebuild.log
          retention-days: 7
