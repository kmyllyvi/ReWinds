[versions]
agp = "8.13.2"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "35"
androidx-activityCompose = "1.12.4"
androidx-appcompat = "1.7.1"
androidx-constraintlayout = "2.2.1"
androidx-core-ktx = "1.17.0"
androidx-espresso-core = "3.7.0"
androidx-material3 = "1.2.1"
androidx-test-junit = "1.3.0"
androidxLifecycle = "2.9.6"
compose-plugin = "1.10.1"
junit = "4.13.2"
kotlin = "2.3.10"
kotlinxCoroutinesCore = "1.10.2"
ktorClientCoreBeta = "3.4.0"
koin = "4.1.1"
koinAnnotations = "2.3.1"
navigationCompose = "2.9.2"
navigation3-ui = "1.0.0-alpha05"
kotlinxSerialization = "1.10.0"
kspVersion = "2.3.0"
datetime = "0.7.1"
napier = "2.7.1"
sqlDelight = "2.2.1"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidx-espresso-core" }
androidx-appcompat = { group = "appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
compose-material3 = { group = "androidx.compose.material3:material3", name = "material3", version.ref = "androidx-material3" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesCore" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
# logging
logger-napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# ktor for networking
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktorClientCoreBeta" }
ktor-client-serialization = { module = "io.ktor:ktor-client-serialization", version.ref = "ktorClientCoreBeta" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktorClientCoreBeta" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktorClientCoreBeta" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktorClientCoreBeta" }
ktor-client-json = { module = "io.ktor:ktor-client-json", version.ref = "ktorClientCoreBeta" }
# ktor engine
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktorClientCoreBeta" }

#ktor android
ktor-client-android = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktorClientCoreBeta" }

#ktor for iOS (ios only dependency)
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktorClientCoreBeta" }

# ktor mock engine — unit tests only (NetworkService error-mapping coverage)
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktorClientCoreBeta" }

# Koin for dependency injection (multiplatform)
# https://insert-koin.io/docs/reference/koin-compose/multiplatform/#
# automatic koin lib version handling
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose" }
koin-multiplatform-compose = { module = "io.insert-koin:koin-compose" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koinAnnotations" }
koin-composeVM = { module = "io.insert-koin:koin-compose-viewmodel"}

#navigation
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
# ViewModel https://www.jetbrains.com/help/kotlin-multiplatform-dev/compose-viewmodel.html
lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }

# SQLDelight
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqlDelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqlDelight" }
# JDBC/in-memory SQLite driver — unit tests only (SqlDelightDatabase merge/transaction coverage)
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqlDelight" }
sqldelight-coroutines-extensions = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqlDelight" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
sqlDelight = { id = "app.cash.sqldelight", version.ref = "sqlDelight" }
kotlinCocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }