<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#19304d"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Isobar ellipses — each rotated 28° more than the last, shrinking inward -->
  <ellipse cx="512" cy="512" rx="410" ry="296" fill="none" stroke="#8ecff0" stroke-width="11" opacity="0.40"/>
  <ellipse cx="512" cy="512" rx="324" ry="233" fill="none" stroke="#8ecff0" stroke-width="11" opacity="0.52" transform="rotate(28,512,512)"/>
  <ellipse cx="512" cy="512" rx="239" ry="171" fill="none" stroke="#8ecff0" stroke-width="10" opacity="0.65" transform="rotate(56,512,512)"/>
  <ellipse cx="512" cy="512" rx="154" ry="108" fill="none" stroke="#8ecff0" stroke-width="9"  opacity="0.78" transform="rotate(84,512,512)"/>
  <ellipse cx="512" cy="512" rx="74"  ry="51"  fill="none" stroke="#8ecff0" stroke-width="8"  opacity="0.90" transform="rotate(112,512,512)"/>

  <!-- Eye of storm -->
  <circle cx="512" cy="512" r="23" fill="#8ecff0"/>
</svg>
