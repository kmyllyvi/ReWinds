kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M" -Djansi.tmpdir=/tmp

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

#custom
# includeAllTargets=false
#for Room database issue
kotlin.native.disableCompilerDaemon = true

#Xcode compatibility
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true