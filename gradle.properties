kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M" -Djansi.tmpdir=/tmp
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

#Xcode compatibility
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true

#Kotlin/Native optimizations (reduce memory pressure)
kotlin.native.disableCompilerDaemon=true
kotlin.native.disable.lto=true
# Heap for the Kotlin/Native compiler process. It is NOT the Gradle daemon, so the
# org.gradle.jvmargs setting above does not apply to it — the compiler's own default is what
# ran out during DevirtualizationAnalysis on the device arm64 release build (KIM-420).
# 6 GB links iosArm64 release with room to spare; raise it before touching compiler flags.
kotlin.native.jvmArgs=-Xmx6g