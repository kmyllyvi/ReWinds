kotlin.code.style=official

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx8192M" -Djansi.tmpdir=/tmp

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#MPP
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.mpp.enableCInteropCommonization=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

#Xcode compatibility
kotlin.apple.xcodeCompatibility.nowarn=true
kotlin.apple.deprecated.allowUsingEmbedAndSignWithCocoaPodsDependencies=true

#Kotlin/Native optimizations (reduce memory pressure)
kotlin.native.disableCompilerDaemon=true
kotlin.native.disable.lto=true
# Disable devirtualization in compiler to reduce memory
kotlin.native.disableDevirtualization=true