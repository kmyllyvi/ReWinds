<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReWinds — Icon Concepts</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0f18;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    gap: 48px;
  }
  h1 {
    color: rgba(255,255,255,0.35);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .row {
    display: flex;
    gap: 48px;
    align-items: flex-end;
    justify-content: center;
  }
  .icon-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  canvas {
    display: block;
    border-radius: 40px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 0.5px rgba(255,255,255,0.07);
  }
  .label {
    color: rgba(255,255,255,0.45);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<h1>ReWinds — App Icon Concepts</h1>

<div class="row">
  <div class="icon-wrap">
    <canvas id="c1" width="180" height="180"></canvas>
    <div class="label">1. Wind Rose</div>
  </div>
  <div class="icon-wrap">
    <canvas id="c2" width="180" height="180"></canvas>
    <div class="label">2. Isobar Spiral</div>
  </div>
  <div class="icon-wrap">
    <canvas id="c5" width="180" height="180"></canvas>
    <div class="label">5. Swoosh + Data</div>
  </div>
</div>

<script>
const CORNER = 40;

function clip(ctx, w, h) {
  ctx.beginPath();
  ctx.moveTo(CORNER, 0);
  ctx.arcTo(w, 0, w, h, CORNER);
  ctx.arcTo(w, h, 0, h, CORNER);
  ctx.arcTo(0, h, 0, 0, CORNER);
  ctx.arcTo(0, 0, w, 0, CORNER);
  ctx.closePath();
  ctx.clip();
}

// ── 1. WIND ROSE ──────────────────────────────────────────────────
{
  const cv = document.getElementById('c1');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W / 2, cy = H / 2;

  ctx.save();
  clip(ctx, W, H);

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#1c4480');
  bg.addColorStop(1, '#081525');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Decorative rings
  [72, 56].forEach((r, i) => {
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${i === 0 ? 0.10 : 0.06})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  });

  // Petal shape: tip → left → inner notch → right → close
  function petal(angleDeg, outerR, innerR, halfW, color, alpha) {
    const a = angleDeg * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(a);
    ctx.globalAlpha = alpha;
    const mid = (outerR + innerR) / 2;
    ctx.beginPath();
    ctx.moveTo(0, -outerR);
    ctx.lineTo(-halfW, -mid);
    ctx.lineTo(0, -innerR);
    ctx.lineTo(halfW, -mid);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  // Cardinal — white
  petal(0,   65, 22, 11, '#ffffff', 1.00); // N (bright)
  petal(90,  65, 22, 11, '#ffffff', 0.95); // E
  petal(180, 65, 22, 11, '#ffffff', 0.45); // S (shadow side)
  petal(270, 65, 22, 11, '#ffffff', 0.45); // W

  // Intercardinal — teal
  petal(45,  48, 18,  8, '#3DD9C0', 0.95); // NE
  petal(135, 48, 18,  8, '#3DD9C0', 0.55); // SE
  petal(225, 48, 18,  8, '#3DD9C0', 0.45); // SW
  petal(315, 48, 18,  8, '#3DD9C0', 0.70); // NW

  // Center bullseye
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#0d1f3c';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.65)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, 4.5, 0, Math.PI * 2);
  ctx.fillStyle = 'white';
  ctx.fill();

  ctx.restore();
}

// ── 2. ISOBAR SPIRAL ──────────────────────────────────────────────
{
  const cv = document.getElementById('c2');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const cx = W / 2, cy = H / 2;

  ctx.save();
  clip(ctx, W, H);

  const bg = ctx.createRadialGradient(cx, cy * 0.8, 0, cx, cy, W * 0.75);
  bg.addColorStop(0, '#19304d');
  bg.addColorStop(1, '#030810');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Rotating ellipses — each 25° more than the last, shrinking inward
  const isobars = [
    { rx: 72, ry: 52, rot: 0,   alpha: 0.40, lw: 2.0 },
    { rx: 57, ry: 41, rot: 28,  alpha: 0.52, lw: 1.9 },
    { rx: 42, ry: 30, rot: 56,  alpha: 0.65, lw: 1.7 },
    { rx: 27, ry: 19, rot: 84,  alpha: 0.78, lw: 1.6 },
    { rx: 13, ry:  9, rot: 112, alpha: 0.90, lw: 1.4 },
  ];

  isobars.forEach(({ rx, ry, rot, alpha, lw }) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot * Math.PI / 180);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = '#8ecff0';
    ctx.lineWidth = lw;
    ctx.stroke();
    ctx.restore();
  });

  // Eye of storm
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#8ecff0';
  ctx.globalAlpha = 1;
  ctx.fill();

  ctx.restore();
}

// ── 5. SWOOSH + DATA ──────────────────────────────────────────────
{
  const cv = document.getElementById('c5');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;

  ctx.save();
  clip(ctx, W, H);

  const bg = ctx.createLinearGradient(0, H, W, 0);
  bg.addColorStop(0, '#180f40');
  bg.addColorStop(0.55, '#0d1f44');
  bg.addColorStop(1, '#091830');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Trailing echo lines (drawn first, behind main swoosh)
  [
    { p: [14, 148, 44, 72, 126, 62, 162, 68], a: 0.12, lw: 2.5 },
    { p: [16, 136, 42, 56, 122, 46, 162, 52], a: 0.28, lw: 3.5 },
  ].forEach(({ p, a, lw }) => {
    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.bezierCurveTo(p[2], p[3], p[4], p[5], p[6], p[7]);
    ctx.strokeStyle = `rgba(255,255,255,${a})`;
    ctx.lineWidth = lw;
    ctx.lineCap = 'round';
    ctx.stroke();
  });

  // Main swoosh
  ctx.beginPath();
  ctx.moveTo(16, 124);
  ctx.bezierCurveTo(40, 38, 118, 28, 162, 36);
  ctx.strokeStyle = 'white';
  ctx.lineWidth = 6;
  ctx.lineCap = 'round';
  ctx.globalAlpha = 1;
  ctx.stroke();

  // Data bars
  const values = [0.28, 0.44, 0.56, 0.70, 0.84, 1.0];
  const bW = 14, gap = 5;
  const startX = 20;
  const baseY = 155;
  const maxH = 40;
  const topR = 3;

  values.forEach((v, i) => {
    const x = startX + i * (bW + gap);
    const h = Math.max(v * maxH, 4);
    const y = baseY - h;

    const barGrad = ctx.createLinearGradient(x, y, x, baseY);
    barGrad.addColorStop(0, '#4DD9C0');
    barGrad.addColorStop(1, 'rgba(40,155,135,0.2)');

    ctx.globalAlpha = 0.85;
    ctx.beginPath();
    ctx.moveTo(x, baseY);
    ctx.lineTo(x, y + topR);
    ctx.arc(x + topR, y + topR, topR, Math.PI, 1.5 * Math.PI);
    ctx.arc(x + bW - topR, y + topR, topR, 1.5 * Math.PI, 0);
    ctx.lineTo(x + bW, baseY);
    ctx.closePath();
    ctx.fillStyle = barGrad;
    ctx.fill();
  });

  ctx.restore();
}
</script>
</body>
</html>
